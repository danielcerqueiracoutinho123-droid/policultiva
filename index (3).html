<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Policultiva: gerencie talhões, culturas, irrigação, dispositivos do solo e finanças da sua fazenda em um só lugar.">
  <meta name="theme-color" content="#047857">
  <title>Policultiva</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23059669'/%3E%3Cpath d='M16 25V14m0 0c0-4 3-7 8-7 0 5-3 7-8 7zm0 4c0-3-2-5-6-5 0 4 2 5 6 5z' stroke='%23fff' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <!-- Tailwind (CDN) e configuração das cores do tema -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    var c = function (v) { return 'hsl(var(--' + v + ') / <alpha-value>)'; };
      tailwind.config = {
        darkMode: 'class',
        theme: { extend: {
          borderRadius: { lg: 'var(--radius)', md: 'calc(var(--radius) - 2px)', sm: 'calc(var(--radius) - 4px)' },
          borderColor: { DEFAULT: 'hsl(var(--border))' },
          colors: {
            background: c('background'), foreground: c('foreground'),
            card: { DEFAULT: c('card'), foreground: c('card-foreground') },
            popover: { DEFAULT: c('popover'), foreground: c('popover-foreground') },
            primary: { DEFAULT: c('primary'), foreground: c('primary-foreground') },
            secondary: { DEFAULT: c('secondary'), foreground: c('secondary-foreground') },
            muted: { DEFAULT: c('muted'), foreground: c('muted-foreground') },
            accent: { DEFAULT: c('accent'), foreground: c('accent-foreground') },
            destructive: { DEFAULT: c('destructive'), foreground: c('destructive-foreground') },
            border: c('border'), input: c('input'), ring: c('ring')
          },
          fontFamily: { heading: ['var(--font-heading)'], body: ['var(--font-body)'] }
        } }
      };
  </script>
</head>
<body>
  <div id="root"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
